name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npx next lint --max-warnings 0
        continue-on-error: true  # ESLint warnings don't fail CI for now

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ASK_MODE: demo
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Smoke test
        run: npx playwright test --project=chromium scripts/smoke.spec.ts
        continue-on-error: true  # Don't fail CI on missing smoke test
